<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الأفلام والمسلسلات</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #fff; }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <nav class="bg-slate-900/80 backdrop-blur-md sticky top-0 z-50 border-b border-slate-800 px-4 py-3 flex justify-between items-center">
        <div class="flex items-center gap-2 cursor-pointer" onclick="goHome()">
            <i class="fa-solid fa-play-circle text-red-600 text-3xl"></i>
            <span class="font-black text-xl tracking-wider text-red-500">Y-VIDEO</span>
        </div>
        <div class="relative w-1/2 md:w-1/3">
            <input type="text" id="searchInput" placeholder="ابحث عن فيلم أو مسلسل..." 
                class="w-full bg-slate-800 text-sm rounded-full py-2 px-4 pr-10 focus:outline-none focus:ring-2 focus:ring-red-500 border border-slate-700"
                onkeypress="if(event.key === 'Enter') searchMulti()">
            <button onclick="searchMulti()" class="absolute right-3 top-2.5 text-slate-400 hover:text-white">
                <i class="fa-solid fa-search"></i>
            </button>
        </div>
    </nav>

    <!-- Main Content Container -->
    <main class="flex-grow container mx-auto px-4 py-6">
        
        <!-- Home View -->
        <div id="homeView">
            <div class="flex gap-4 mb-6 border-b border-slate-800 pb-3">
                <button onclick="switchTab('movie')" id="btnMovie" class="font-bold text-red-500 border-b-2 border-red-500 pb-1">الأفلام</button>
                <button onclick="switchTab('tv')" id="btnTv" class="font-bold text-slate-400 pb-1">المسلسلات</button>
            </div>

            <h2 id="sectionTitle" class="text-xl font-bold mb-4 border-r-4 border-red-600 pr-3">الأفلام الرائجة حالياً</h2>
            <!-- شبكة البوسترات رجعت زي ما هي -->
            <div id="mediaGrid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
                <div class="text-center col-span-full py-10 text-slate-400">جاري التحميل...</div>
            </div>
        </div>

        <!-- Watch View -->
        <div id="watchView" class="hidden">
            <button onclick="goHome()" class="mb-4 bg-slate-800 hover:bg-slate-700 text-white px-4 py-2 rounded-lg text-sm flex items-center gap-2 w-fit">
                <i class="fa-solid fa-arrow-right"></i> العودة للرئيسية
            </button>
            <div class="bg-slate-900 rounded-xl overflow-hidden shadow-2xl border border-slate-800">
                <!-- Video Player Iframe -->
                <div class="relative w-full aspect-video bg-black">
                    <iframe id="videoPlayer" src="" class="w-full h-full border-0" sandbox="allow-scripts allow-same-origin allow-presentation" allowfullscreen></iframe>
                </div>
                
                <!-- Multi-Server Controls -->
                <div class="p-4 bg-slate-950 border-t border-slate-800 flex flex-wrap gap-2 items-center">
                    <span class="text-xs text-slate-400 ml-2"><i class="fa-solid fa-server"></i> سيرفرات العرض:</span>
                    <button onclick="setEmbedServer(1)" id="srvBtn1" class="bg-red-600 text-white px-3 py-1.5 rounded text-xs font-bold transition">سيرفر EmbedSu</button>
                    <button onclick="setEmbedServer(2)" id="srvBtn2" class="bg-slate-800 text-slate-300 px-3 py-1.5 rounded text-xs font-bold transition">سيرفر VidSrc V2</button>
                </div>

                <!-- Details -->
                <div class="p-5">
                    <h1 id="mediaTitle" class="text-2xl font-bold mb-2">العنوان</h1>
                    <p id="mediaOverview" class="text-slate-400 text-sm leading-relaxed">الوصف يظهر هنا...</p>
                </div>
            </div>
        </div>

    </main>

    <footer class="bg-slate-900 border-t border-slate-800 text-center py-4 text-xs text-slate-500">
        تم التطوير بواسطة يوسف &bull; بدون إعلانات نهائياً
    </footer>

    <!-- JavaScript Logic -->
    <script>
        const API_KEY = '3fd2be6f0c70a2a598f084ddfb75487c';
        const IMG_PATH = 'https://image.tmdb.org/t/p/w500';
        
        let currentType = 'movie';
        let currentId = null;
        let currentMediaType = 'movie';

        const mediaGrid = document.getElementById('mediaGrid');
        const homeView = document.getElementById('homeView');
        const watchView = document.getElementById('watchView');
        const videoPlayer = document.getElementById('videoPlayer');
        const mediaTitle = document.getElementById('mediaTitle');
        const mediaOverview = document.getElementById('mediaOverview');
        const searchInput = document.getElementById('searchInput');
        const sectionTitle = document.getElementById('sectionTitle');
        const btnMovie = document.getElementById('btnMovie');
        const btnTv = document.getElementById('btnTv');

        function fetchMedia() {
            // شيلنا اللغة الإجبارية من الرابط الأساسي عشان البوسترات والأسعار ترجع لطبيعتها الأصلية العالمية
            const url = `https://api.themoviedb.org/3/trending/${currentType}/day?api_key=${API_KEY}`;
            loadData(url);
        }

        async function loadData(url) {
            try {
                const res = await fetch(url);
                const data = await res.json();
                showMedia(data.results);
            } catch (error) {
                mediaGrid.innerHTML = `<div class="col-span-full text-center text-red-500">فشل في التحميل، تأكد من اتصال الإنترنت.</div>`;
            }
        }

        function showMedia(items) {
            mediaGrid.innerHTML = '';
            if (!items || items.length === 0) {
                mediaGrid.innerHTML = `<div class="col-span-full text-center text-slate-400 py-10">لا توجد نتائج مطابقة</div>`;
                return;
            }

            items.forEach(item => {
                const id = item.id;
                const title = item.original_title || item.original_name || item.title || item.name;
                const poster_path = item.poster_path;
                const vote_average = item.vote_average;
                const date = item.release_date || item.first_air_date;
                const poster = poster_path ? IMG_PATH + poster_path : 'https://via.placeholder.com/500x750?text=No+Image';
                
                const card = document.createElement('div');
                card.className = 'bg-slate-800 rounded-lg overflow-hidden shadow-lg cursor-pointer transform transition hover:scale-105 border border-slate-700/50 flex flex-col justify-between';
                card.onclick = () => playItem(id, title, item.overview, currentType);

                card.innerHTML = `
                    <div class="relative aspect-[2/3] bg-slate-900">
                        <img src="${poster}" alt="${title}" class="w-full h-full object-cover">
                        <span class="absolute top-2 left-2 bg-black/70 text-yellow-400 text-xs px-2 py-1 rounded font-bold backdrop-blur-sm">
                            <i class="fa-solid fa-star"></i> ${vote_average ? vote_average.toFixed(1) : 'N/A'}
                        </span>
                    </div>
                    <div class="p-3">
                        <h3 class="font-bold text-sm truncate mb-1" dir="ltr">${title}</h3>
                        <p class="text-xs text-slate-400">${date ? date.split('-')[0] : ''}</p>
                    </div>
                `;
                mediaGrid.appendChild(card);
            });
        }

        function switchTab(type) {
            currentType = type;
            if (type === 'movie') {
                btnMovie.className = "font-bold text-red-500 border-b-2 border-red-500 pb-1";
                btnTv.className = "font-bold text-slate-400 pb-1";
                sectionTitle.innerText = "الأفلام الرائجة حالياً";
            } else {
                btnTv.className = "font-bold text-red-500 border-b-2 border-red-500 pb-1";
                btnMovie.className = "font-bold text-slate-400 pb-1";
                sectionTitle.innerText = "المسلسلات الرائجة حالياً";
            }
            fetchMedia();
        }

        function searchMulti() {
            const query = searchInput.value.trim();
            if (query) {
                const searchUrl = `https://api.themoviedb.org/3/search/multi?api_key=${API_KEY}&query=${encodeURIComponent(query)}`;
                loadData(searchUrl);
                sectionTitle.innerText = `نتائج البحث عن: "${query}"`;
            } else {
                fetchMedia();
            }
        }

        function playItem(id, title, overview, type) {
            currentId = id;
            currentMediaType = type;

            homeView.classList.add('hidden');
            watchView.classList.remove('hidden');

            mediaTitle.innerText = title;
            mediaTitle.setAttribute('dir', 'ltr');
            mediaOverview.innerText = overview || 'لا توجد قصة متوفرة حالياً.';
            
            setEmbedServer(1);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function setEmbedServer(serverNum) {
            for(let i = 1; i <= 2; i++) {
                const btn = document.getElementById(`srvBtn${i}`);
                if(btn) {
                    btn.className = (i === serverNum) 
                        ? "bg-red-600 text-white px-3 py-1.5 rounded text-xs font-bold transition" 
                        : "bg-slate-800 text-slate-300 px-3 py-1.5 rounded text-xs font-bold transition hover:bg-slate-700";
                }
            }

            let embedUrl = '';
            
            if (currentMediaType === 'tv') {
                if (serverNum === 1) {
                    embedUrl = `https://embed.su/embed/tv/${currentId}/1/1`;
                } else {
                    embedUrl = `https://vidsrc.cc/v2/embed/tv/${currentId}/1/1`;
                }
            } else {
                if (serverNum === 1) {
                    embedUrl = `https://embed.su/embed/movie/${currentId}`;
                } else {
                    embedUrl = `https://vidsrc.cc/v2/embed/movie/${currentId}`;
                }
            }

            videoPlayer.src = embedUrl;
        }

        function goHome() {
            watchView.classList.add('hidden');
            homeView.classList.remove('hidden');
            videoPlayer.src = '';
            searchInput.value = '';
            fetchMedia();
        }

        fetchMedia();
    </script>
</body>
</html>
